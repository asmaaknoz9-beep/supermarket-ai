<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيت الجملة</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f3f4f6}header{background:#065f46;color:#fff;padding:12px;text-align:center} .s{padding:10px}input{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc} #list{padding:10px;display:grid;gap:10px} .card{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 6px #0001;display:flex;justify-content:space-between} #ab{background:#fff;margin:10px;padding:12px;border-radius:12px}</style>
</head>
<body>
<header><h1>🏠 بيت الجملة</h1></header>
<div class="s"><input id="q" placeholder="🔍 ابحثي عن صنف..." oninput="r()"></div>
<div id="list"></div>
<div id="ab"><b>إضافة صنف جديد</b><input id="n" placeholder="اسم الصنف"><input id="p" placeholder="السعر" type="number"><button onclick="sav()">حفظ</button></div>
<script>
let def=[["منظفات",120,"اريال 3 كيلو"],["منظفات",80,"برسيل 2 كيلو"]];
let saved=null;try{saved=JSON.parse(localStorage.getItem('d'))}catch(e){}
let d=(saved&&saved.length>0)?saved:def;
function r(){let q=document.getElementById('q').value;let l=document.getElementById('list');l.innerHTML='';d.forEach((x,i)=>{if(q&&!x[2].includes(q))return;l.innerHTML+=`<div class=card><span>${x[2]} - ${x[1]} جنيه</span><button onclick="del(${i})">حذف</button></div>`})}
function del(i){if(confirm('تحذفي الصنف؟')){d.splice(i,1);localStorage.setItem('d',JSON.stringify(d));r()}}
function sav(){let nn=document.getElementById('n').value;let pp=document.getElementById('p').value;if(!nn)return; d.push(["",pp,nn]);localStorage.setItem('d',JSON.stringify(d));r();document.getElementById('n').value='';}
r();
</script>
</body>
</html>
